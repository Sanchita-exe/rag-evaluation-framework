[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-evaluation-framework"
version = "0.1.0"
description = "A modular framework for evaluating and optimizing Retrieval-Augmented Generation (RAG) pipelines"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Adaptive RAG Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]

# Core dependencies for Milestone 1 (Chunking, BM25, Schemas, Metrics)
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
    "rank-bm25>=0.2.2",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
# Development, testing, and linting
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

# Dense retrieval and embeddings (Milestone 2)
dense = [
    "torch>=2.2.0",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
]

# API Backend (Milestone 5)
api = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
]

# UI Dashboard (Milestone 5)
ui = [
    "streamlit>=1.35.0",
]

# All optional dependencies combined
all = [
    "rag-evaluation-framework[dev,dense,api,ui]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = []

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
